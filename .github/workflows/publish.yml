name: Publish Docs

on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to push to gh-pages
permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy MkDocs
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history lets mkdocs-material render git revision dates
          fetch-depth: 0

      # ── uv ────────────────────────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ── Taskfile (task CLI) ────────────────────────────────────────────────
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── MkDocs toolchain ──────────────────────────────────────────────────
      - name: Install MkDocs via uv
        run: task proj/init

      # ── Build & deploy ────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        run: task docs/deploy
        env:
          # mkdocs gh-deploy uses git under the hood; supply identity
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
